name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Новый пуш отменяет устаревшую сборку той же ветки
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # публикация релиза с APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты ядра
        run: ./gradlew :core:test
      - name: Сборка APK
        run: |
          ./gradlew :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/NullSignal-0.1.${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: NullSignal-apk
          path: dist/*.apk
      - name: GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NULL//SIGNAL 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: ${{ github.event.head_commit.message }}
          files: dist/*.apk
